# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity. This commits the date to KEEPALIVE once a month so the
# 5-minute uptime-relay schedule keeps running.
name: keep-alive

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit the date to KEEPALIVE
        run: |
          date -u +%Y-%m-%d > KEEPALIVE
          git add KEEPALIVE
          if git diff --cached --quiet; then
            echo "KEEPALIVE already has today's date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: keep-alive $(date -u +%Y-%m-%d)"
          git push
